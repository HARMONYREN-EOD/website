<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innova</title>

  <link rel="icon" href="/assets/svg/innova.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/global.css" />

  <style>
    main {
      max-width: 720px;
      margin: clamp(2rem, 8vh, 5rem) auto;
      padding: 0 clamp(1rem, 4vw, 1.5rem);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin-bottom: 1rem;
    }

    #logo {
      display: block;
      width: clamp(120px, 35vw, 220px);
      margin: 1.5rem auto;
      border-radius: 50%;
    }

    p {
      max-width: 40ch;
      margin: 1.5rem auto;
      line-height: 1.6;
      font-size: clamp(0.95rem, 2.5vw, 1rem);
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--fg-color);
      text-decoration: none;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
    }

    .btn:hover {
      color: var(--bg-color);
      background-color: var(--fg-color);
    }

    @media (prefers-reduced-motion: reduce) {
      #logo {
        transform: none !important;
      }
    }
    
  </style>

</head>

<body>
  <main>
    <h1>Innova</h1>

    <img id="logo" src="/assets/svg/innova.svg" alt="Innova logo" loading="eager" />

    <p>
      A community built to share knowledge across multiple fields,
      nurturing collaboration and innovation.
    </p>

    <a class="btn" href="https://discord.gg/ePtEQCCG9B" target="_blank" rel="noopener">
      Join the Discord server
    </a>
  </main>

  <script>
    const logo = document.getElementById("logo");
    let angle = 0;

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      function rotate_logo() {
        angle = (angle + 0.25) % 360;
        logo.style.transform = `rotate(${angle}deg)`;
        requestAnimationFrame(rotate_logo);
      }
      rotate_logo();
    }
  </script>

</body>

</html>
